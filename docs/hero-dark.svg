<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" role="img" aria-labelledby="t d" viewBox="0 0 1200 380"><title id="t">SecureCart</title><desc id="d">SecureCart: trust-first commerce. Django REST and React storefront with rotating httpOnly refresh tokens, RBAC, oversell-proof checkout, idempotent payments, an audit log and a strict CSP.</desc><path d="M0 0h1200v380H0z"/><g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><g transform="translate(486 60)"><path fill="#4c9bff" d="m26.1 3.77 17.4 6.96v13.195c0 11.31-7.25 20.3-17.4 24.505C15.95 44.225 8.7 35.235 8.7 23.925V10.73z"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3.48" d="M20.88 22.62v-2.465a5.22 5.22 0 0 1 10.44 0v2.465"/><rect width="11.7" height="9.6" x="12.15" y="15.3" fill="#fff" rx="2.1" transform="scale(1.45)"/><text x="58" y="36" fill="#f5f5f7" font-size="34" font-weight="600" letter-spacing="-.8">SecureCart</text></g><text x="600" y="190" fill="#f5f5f7" font-size="64" font-weight="600" letter-spacing="-2" text-anchor="middle">Good things, bought safely.</text><text x="600" y="246" fill="#a1a1a6" font-size="24" text-anchor="middle">Trust-first commerce: Django REST + React, with every protection real and in the code.</text><rect width="222.5" height="34" x="126.5" y="300" fill="#1d1d1f" stroke="#2c2c2e" rx="17"/><path fill="none" stroke="#4c9bff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m140.5 317.5 3.2 3.2 6-6.4"/><text x="154.5" y="322" fill="#f5f5f7" font-size="14">httpOnly rotating refresh</text><rect width="69.2" height="34" x="359" y="300" fill="#1d1d1f" stroke="#2c2c2e" rx="17"/><path fill="none" stroke="#4c9bff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m373 317.5 3.2 3.2 6-6.4"/><text x="387" y="322" fill="#f5f5f7" font-size="14">RBAC</text><rect width="207.9" height="34" x="438.2" y="300" fill="#1d1d1f" stroke="#2c2c2e" rx="17"/><path fill="none" stroke