name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: securecart
          POSTGRES_PASSWORD: securecart
          POSTGRES_DB: securecart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U securecart"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ["1025:1025", "8025:8025"]
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports: ["12111:12111"]
      redis:
        image: redis:8.8.3-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://securecart:securecart@localhost:5432/securecart
      # Real SMTP delivery tests (tests/test_mailpit.py) run against this Mailpit.
      MAILPIT_URL: http://localhost:8025
      MAILPIT_SMTP_PORT: "1025"
      # Stripe API contract tests (tests/test_stripe.py) run against stripe-mock.
      STRIPE_MOCK_URL: http://localhost:12111
      # Atomic rate limits and the catalog cache (tests/test_cache_and_throttling.py).
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint (backend and repo scripts)
        run: uv run ruff check . ../scripts
      - name: Ruff format
        run: uv run ruff format --check . ../scripts
      - name: Mypy
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
      - name: OpenAPI schema is valid
        run: uv run python manage.py spectacular --validate --fail-on-warn --file /dev/null
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
      - name: Tests (PostgreSQL, incl. concurrency)
        run: uv run pytest --cov --cov-report=term --cov-fail-under=90

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: securecart
          POSTGRES_PASSWORD: securecart
          POSTGRES_DB: securecart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U securecart"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://securecart:securecart@localhost:5432/securecart
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      # The specs sign in many times within a minute; production keeps 10/min.
      THROTTLE_AUTH: 120/min
      THROTTLE_CHECKOUT: 120/min
      # Account emails go to Mailpit, whose API the account-recovery spec reads.
      EMAIL_BACKEND: smtp
      EMAIL_HOST: localhost
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "false"
      APP_BASE_URL: http://localhost:4173
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate a throwaway secret key
        run: echo "DJANGO_SECRET_KEY=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Migrate and seed the demo store
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_demo
      - name: Start the API (gunicorn, DEBUG off, Secure refresh cookie)
        working-directory: backend
        run: |
          nohup uv run gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 \
            > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health/ && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the SPA
        working-directory: frontend
        run: npm run build
      - name: Playwright + axe (served by vite preview with nginx's CSP)
        working-directory: frontend
        env:
          VITE_DEV_API_PROXY: http://127.0.0.1:8000
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/api.log
          retention-days: 7

  image-scan:
    name: Image scan (Trivy + hadolint)
    runs-on: ubuntu-24.04
    env:
      TRIVY_VERSION: "0.76.1"
      # SHA-256 of trivy_0.76.1_Linux-64bit.tar.gz from the release's checksums file, whose
      # Sigstore signature was verified first (docs/adr/0001-container-image-scanning.md).
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
      TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfiles (hadolint)
        run: |
          set -euo pipefail
          for dockerfile in backend/Dockerfile frontend/Dockerfile; do
            echo "::group::$dockerfile"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint --failure-threshold warning - < "$dockerfile"
            echo "::endgroup::"
          done
      - name: Install Trivy (checksum-verified release)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          sudo install -m 0755 "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          trivy --version
      - name: Date for the database cache key
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore the vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache
          # One database per day: fresh enough for new advisories, cheap to restore.
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - name: Build the images we ship
        env:
          DJANGO_SECRET_KEY: build-only
          POSTGRES_PASSWORD: build-only
          REDIS_PASSWORD: build-only
        run: docker compose build
      - name: Scan shipped images (fail on fixable HIGH/CRITICAL)
        run: scripts/scan_images.sh gate
      - name: Scan local-only emulators (report only, never deployed)
        if: always()
        run: scripts/scan_images.sh report
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports
          path: trivy-reports/
          retention-days: 14

  docker:
    name: Docker images + compose smoke test
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create CI environment file
        run: |
          {
            echo "DJANGO_SECRET_KEY=$(openssl rand -base64 48)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } > .env
      - name: Build images
        run: docker compose build
      - name: Start stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health/ | grep -q '"redis":"ok"'
          # The catalog is served from Redis on the second read.
          curl -fsS -o /dev/null "http://localhost:8080/api/products/?search=lamp"
          curl -fsS -D - -o /dev/null "http://localhost:8080/api/products/?search=lamp" | grep -qi "x-cache: HIT"
          # The scheduler has run its jobs at least once.
          docker compose exec -T scheduler test -f /tmp/scheduler-heartbeat
          curl -fsS "http://localhost:8080/api/products/?search=lamp" | grep -q "Halo Table Lamp"
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin/dashboard/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/products/halo-table-lamp)" = "200"
          # Account email leaves the API over SMTP and lands in Mailpit.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json'             -d '{"email":"maya@example.com"}' http://localhost:8080/api/auth/password/forgot/)" = "202"
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8025/api/v1/messages | grep -q "Reset your SecureCart password" && exit 0
            sleep 1
          done
          echo "reset email never reached Mailpit"; exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
