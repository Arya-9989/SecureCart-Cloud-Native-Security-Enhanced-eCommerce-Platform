name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: securecart
          POSTGRES_PASSWORD: securecart
          POSTGRES_DB: securecart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U securecart"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://securecart:securecart@localhost:5432/securecart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
      - name: OpenAPI schema is valid
        run: uv run python manage.py spectacular --validate --fail-on-warn --file /dev/null
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
      - name: Tests (PostgreSQL, incl. concurrency)
        run: uv run pytest --cov --cov-report=term --cov-fail-under=90

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker images + compose smoke test
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create CI environment file
        run: |
          {
            echo "DJANGO_SECRET_KEY=$(openssl rand -base64 48)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
          } > .env
      - name: Build images
        run: docker compose build
      - name: Start stack and wait for health checks
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health/ | grep -q '"ok"'
          curl -fsS "http://localhost:8080/api/products/?search=lamp" | grep -q "Halo Table Lamp"
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/admin/dashboard/)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/products/halo-table-lamp)" = "200"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
