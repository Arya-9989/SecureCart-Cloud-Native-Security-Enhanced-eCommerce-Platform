upstream securecart_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # Build output is pre-compressed at gzip -9 in the image (see Dockerfile); anything else
    # is compressed on the fly. nginx's default level (1) left ~15% of every byte on the wire.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API and the Swagger/ReDoc static bundles are served by Django.
    location ~ ^/(api|static)/ {
        proxy_pass http://securecart_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Product artwork. Matched by extension so SPA routes like /products/<slug> still work.
    location ~* ^/products/[a-z0-9-]+\.svg$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # SPA routes fall back to index.html, which must never be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
