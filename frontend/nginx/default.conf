# The shop page reads its query string: the bare /shop and a lone category filter (the nav
# and footer links) have prerendered files; any other query gets the SPA shell.
map $args $shop_page {
    ""                              /_prerender/shop.html;
    "~^category=(?<cat>[a-z0-9-]+)$" /_prerender/shop/$cat.html;
    default                         /index.html;
}

# Behind a TLS-terminating ingress (Kubernetes), keep the scheme the client used so Django
# knows the request was HTTPS (it only trusts this when DJANGO_BEHIND_TLS_PROXY is set).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

upstream securecart_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # Build output is pre-compressed at gzip -9 in the image (see Dockerfile); anything else
    # is compressed on the fly. nginx's default level (1) left ~15% of every byte on the wire.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Product image uploads are the only bodies over 1 MiB the API accepts (the API itself
    # enforces MAX_IMAGE_UPLOAD_BYTES, 5 MiB by default, and admin-only access).
    location ~ ^/api/admin/products/[0-9]+/image/$ {
        client_max_body_size 6m;
        proxy_pass http://securecart_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # API and the Swagger/ReDoc static bundles are served by Django.
    location ~ ^/(api|static)/ {
        proxy_pass http://securecart_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Product artwork. Matched by extension so SPA routes like /products/<slug> still work.
    location ~* ^/products/[a-z0-9-]+\.svg$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Public pages prerendered at build time (frontend/scripts/prerender.mjs): each URL gets
    # its own complete HTML, which the app then hydrates. src/prerender/routing.ts applies the
    # same rules for `vite preview`. Anything not prerendered falls back to the SPA shell.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /_prerender/index.html /index.html;
    }
    location = /protection {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /_prerender/protection.html /index.html;
    }
    location = /shop {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $shop_page /index.html;
    }
    location ~ ^/products/[a-z0-9-]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /_prerender$uri.html /index.html;
    }
    # The prerendered files are only served on their own URLs, never under /_prerender/.
    location ^~ /_prerender/ {
        internal;
    }

    # SPA routes fall back to index.html, which must never be cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
