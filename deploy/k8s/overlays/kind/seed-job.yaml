# Demo catalog, accounts and order history (idempotent), once migrations have run.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-demo
  labels:
    app.kubernetes.io/name: seed-demo
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-demo
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: securecart-backend
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - until python manage.py migrate --check >/dev/null 2>&1; do sleep 3; done;
              python manage.py seed_demo
          envFrom:
            - configMapRef:
                name: securecart-config
            - secretRef:
                name: securecart-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
