apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: securecart
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      initContainers:
        # Serve only a migrated schema: wait until the migrate Job has finished.
        - name: wait-for-migrations
          image: securecart-backend
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - until python manage.py migrate --check >/dev/null 2>&1; do
                echo "waiting for migrations"; sleep 3;
              done
          envFrom:
            - configMapRef:
                name: securecart-config
            - secretRef:
                name: securecart-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: securecart-backend
          imagePullPolicy: IfNotPresent
          args:
            - gunicorn
            - config.wsgi:application
            - --bind=0.0.0.0:8000
            - --workers=2
            - --worker-tmp-dir=/tmp
            - --no-control-socket
            - --access-logfile=-
            - --forwarded-allow-ips=*
            - --graceful-timeout=20
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: securecart-config
            - secretRef:
                name: securecart-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          startupProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: backend
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: backend
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness must not depend on the database: a database outage should take pods
          # out of rotation (readiness), not restart them in a loop.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            # Let endpoints update before gunicorn stops accepting connections.
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  # The frontend's nginx proxies /api to "backend:8000".
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
