# Schema migrations (and the media bucket) as a release step, run once per deploy. The API
# pods wait for it in their init container. Re-run on a new release with:
#   kubectl -n securecart delete job migrate --ignore-not-found && kubectl apply -k <overlay>
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/component: release
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/component: release
    spec:
      restartPolicy: OnFailure
      serviceAccountName: securecart
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: securecart-backend
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - python manage.py migrate --noinput && python manage.py init_media_storage
          envFrom:
            - configMapRef:
                name: securecart-config
            - secretRef:
                name: securecart-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 384Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
