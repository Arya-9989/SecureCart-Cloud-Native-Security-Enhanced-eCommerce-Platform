name: securecart

# Production-shaped local stack: PostgreSQL, Django API (gunicorn) and the SPA served by
# nginx, which also reverse-proxies /api so the browser only ever talks to one origin.
# Mailpit stands in for a real SMTP relay and catches every email locally.
# Usage: cp .env.example .env && docker compose up --build  ->  http://localhost:8080
#        Caught email (verification and reset links): http://localhost:8025

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-securecart}
      POSTGRES_USER: ${POSTGRES_USER:-securecart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backend:
    <<: *hardening
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
      DJANGO_CACHE_BACKEND: db
      DATABASE_URL: postgres://${POSTGRES_USER:-securecart}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-securecart}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      NUM_PROXIES: "1"
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_CUSTOMER_PASSWORD: ${DEMO_CUSTOMER_PASSWORD:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-apps.payments.providers.mock.MockPaymentProvider}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Every setting the README documents can be changed from .env (defaults shown).
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-10}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      THROTTLE_AUTH: ${THROTTLE_AUTH:-10/min}
      THROTTLE_AUTH_REFRESH: ${THROTTLE_AUTH_REFRESH:-60/min}
      THROTTLE_CHECKOUT: ${THROTTLE_CHECKOUT:-20/min}
      THROTTLE_ANON: ${THROTTLE_ANON:-120/min}
      THROTTLE_USER: ${THROTTLE_USER:-600/min}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_BEHIND_TLS_PROXY: ${DJANGO_BEHIND_TLS_PROXY:-false}
      STORE_CURRENCY: ${STORE_CURRENCY:-USD}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-75.00}
      FLAT_SHIPPING_FEE: ${FLAT_SHIPPING_FEE:-6.99}
      TAX_RATE: ${TAX_RATE:-0.08}
      MAX_CART_LINE_QUANTITY: ${MAX_CART_LINE_QUANTITY:-10}
      # Email: Mailpit by default; point these at a real relay for a deployment.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      EMAIL_BACKEND: smtp
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-SecureCart <no-reply@securecart.dev>}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-true}
      THROTTLE_ACCOUNT_EMAIL: ${THROTTLE_ACCOUNT_EMAIL:-5/min}
      THROTTLE_ACCOUNT_EMAIL_RECIPIENT: ${THROTTLE_ACCOUNT_EMAIL_RECIPIENT:-3/hour}
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy

  # Local SMTP sink with a web inbox. Never deployed: real deployments set EMAIL_HOST.
  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.31.6
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    tmpfs:
      - /tmp
      - /data

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-true}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    tmpfs:
      - /tmp
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
